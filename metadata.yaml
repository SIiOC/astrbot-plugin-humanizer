name: astrbot_plugin_wanna_be_human
desc: 通过人类风格注入、AI痕迹去除与主动续聊，让机器人的交流体感更接近人类。
help: |
  插件启用后自动生效：生成前注入人类对话风格（口癖/句式/检索示例），
  生成后去除 AI 痕迹（规则清理或 LLM 深度改写；深度改写自动融合当前风格口癖）。
  风格管理：/style_list 查看、/style_use 切换、/style_build 提炼、/style_import 导入语料、
  /style_refine 增量融合、/style_index 重建检索索引；也可在配置界面上传语料自动提炼。
  v2.3.0 结构化人格：/style_import_colleague 导入 colleague-skill 人物人格产物，
  /style_correct 记录"TA 绝不会这样说"的纠错；档案新增决策规则/人际脚本/纠错记录三维度。
  改写模型：/humanizer_models 查看列表，/humanizer_model <编号|模型名|off> 选择。
  主动聊天：enable_proactive（默认关闭）开启后，用户沉默一段时间自动发消息。
  v2.5 动态一天状态：enable_life（默认开启）向每次对话注入"此刻在做什么/心情/时间"，
  让 AI 拥有随真实时间推进的一天生活（零模型调用）；日程模板/心情池可在配置中调整。
  v2.6 模型故障切换：深度改写遇传输失败自动切换下一个候选模型（首选 rewrite_model/
  当前会话模型，其余 provider 补全），内容校验失败才回落规则清理。
  v2.7 插件控制台：插件管理 → 打开插件 UI 界面，总览/配置/记录回看（含思考过程）。
  v2.8 控制台升级 Vue3+Vite 全功能版：配置/风格管理/语料/主动聊天状态/统计 全页签。
  v2.8.1 修复：配置保存 postMessage 克隆失败 + 偶发"XX读取失败"（语料/风格/配置读取健壮性）。
  v2.9 UI 优化：风格生成入口融合（语料提炼/人格文本导入二选一）+ 控制台全中文化 + 少女粉主题。
  v2.9.1 视觉增强：背景粉紫渐变 + 页面过渡 + 图标彩色化 + 渐变统计卡 + 对话气泡。
  v2.9.2 主题「星穹甜心」：深空星野底×霓虹粉×电光青，玻璃拟态+霓虹发光。
  v2.9.3 液态玻璃：全屏星野底层、卡片镜面高光+光泽划过、侧栏顶栏玻璃化。
  v2.9.4 语料页支持拖拽/点击上传文件导入（txt/json/jsonl/csv）。
  v2.9.5 稳定性：完整管线主动消息（pipeline 恢复）、配置页动态下拉（嵌入提供商/
  模型/风格）与开关数字控件、路由表完整性防御、多项导入链修复。
  v2.9.6 发布适配：版本号推进以绕过市场判重缓存；分发档案仅保留「默认风格」。
  v2.9.7 知识库适配：语料上传按 16 条/请求分片嵌入，兼容 DashScope 文本向量接口
  批量上限，修复检索建库失败。
  v3.0 对话间时间流动感知：新增「时间流动」分组（默认开启）——每次对话注入
  当前时间与距上次交流的时长（30 分钟内视为连续对话不注入；mixed/coarse/precise
  三档粒度）；「动态一天状态」可选开启 LLM 每日生活时间线（默认关）：每天 00:05
  自动生成一天安排（含时段/心情/地点，跨天连贯），对话时按真实时间选中当前时段
  注入，生成失败自动回退日程模板。
  v3.2 消息防抖并入：合并短时间内连续发送的私聊消息再交给 LLM（原独立插件
  astrbot_plugin_chat_debounce 能力，自适应等待/撤回过滤/输入状态感知），并新增
  主动消息「插话丢弃」——生成期间用户发言或对方正在输入时，本次主动消息自动让位。
  新增主动消息会话白名单（proactive_session_allowlist），仅对指定会话生效，白名单外自动清理。
  v3.3.0 更名：astrbot_plugin_humanizer → astrbot_plugin_wanna_be_human
  （display_name/功能/命令不变；新增主动消息会话白名单 proactive_session_allowlist）。
  v3.3.1 发送纪律：新增「发送纪律」分组（默认开启），生成前注入硬规则，
  禁止模型在同一响应里既输出正文又调用 send_message_to_user 发送同样内容，
  防止用户收到两条重复消息。
  v3.5.0 对话节奏引擎：按距用户最后发言的间隔自动分档对话热度（热聊/常态/
  冷场，界线随主动消息触发时长自动缩放），热聊秒回短句、冷场放缓并轻描淡写；
  检索示例注入支持 rerank 重排（配置重排供应商与候选池，留空跟随知识库设置）。
  v3.6.0 分段发送（多气泡连发，默认关）+ 对话间时间流逝连续性感知
  （隔夜/隔几天/久别各有开口方式）+ 真人感规则补库（禁客服腔/禁过度附和/禁强行提问收尾）。
  v3.7.0 时间流逝增强：情绪随时间半衰期淡去+久别重逢情绪指令；历法感知（农历/节气/
  传统节日+敏感日说话护栏，软依赖 lunar_python，缺库静默关）；相识天数注入（默认关）；
  时间上下文 mark_as_temp 不入历史；检索/提炼超时与会话卡死防护。
  v3.8.0 时间感知收尾+主动性+情绪深化：双向间隔感知（「对方/你最后发言 X」各自计时，
  默认关）；时间行为规则入库（4 条内置）；冷落降温弧线（主动消息随沉默时长 想念→试探→
  失望→抽离，默认关）；久别情绪恢复曲线分档；主动消息迟到补发话术（超阈值自然带「来晚了」）；
  承诺簿（捕捉 Bot 许下的未来承诺，到期提醒兑现/说明，/commitment_list|done|drop 管理，
  默认关）。
  v3.9.0 主动消息 v2：话题来源选择器（聊天延续/生活近况/预置话题池/混选，默认 mixed）；
  未回信轻追问（12~20 分钟后再轻碰一句，最多 2 条，默认关）；沉默自适应间隔（连续不回时
  敲门间隔同步放大）；真人感 tells 补库（内置 14→22 条）。
  其他：enable_llm_rewrite（深度改写）、remove_emoji、remove_reasoning（仅隐藏不省 token）、
  debug（命中日志），详见 README。
  v4.0.0：大版本——架构重构（装配层/services/core 分层、统一 StateStore 与 LLM 调用点、纯函数 core）
  与第五轮调研融入波 1 合入：tells 扩容至 31 条内置并引入 S1/S2/S3 严重度分级；注入节奏改为
  严重度感知子集轮换并贴近对话末尾（旧框架回退 system_prompt）；免打扰时段支持按星期前缀，
  新增活跃时段白名单（仅在其内主动）；情绪×对话热度耦合（热聊升温/冷场降温，热度成为
  情绪主导来源，emotion_heat_drift_* 可调）；应声虫复读（用户发搞怪消息时小概率原样学舌，
  默认关，parrot 组配置）；控制台新增实时事件流与总览仪表盘（并入 v3.9.6）。
  v4.0.1：修复批（外审两轮审查）——主动消息死会话回收与连续未回复硬上限、防抖竞态、
  模型列表失败缓存、承诺 ID 碰撞、时间边界防御等，详见 CHANGELOG。
  v4.0.3：内置语料池与构建脚本的不一致已评估（根因是 v3.10.0 换了语料来源但脚本
  长度窗没跟着改），经确认后维持原始语料不过滤，诊断结论记入 CHANGELOG；控制台
  「时间线生成模型」等 5 个模型字段补齐下拉（原 life/extract_model 死键）、指令前缀
  列表改为可编辑；文档同步（7 页/7 组/parrot 组/语料署名）；撤冗余端点
  styles/import-colleague；清理未用 import 与配置文案歧义。
  v4.0.4：发布适配——版本号推进以避开已部署的 4.0.3（内容与 4.0.3 同源，仅元数据不同）；
  astrbot_version 补上界 "<5"（原先只有 ">=4.5.7"，AstrBot 5.x 发布时会静默装上一个
  不兼容版本）；补声明 support_platforms 全平台适配器（本插件走 LLM 钩子与通用消息事件，
  不依赖特定平台 API，输入状态感知等可选能力缺失时静默降级）。
version: 4.0.4
author: SIiOC
repo: https://github.com/SIiOC/astrbot-plugin-humanizer
license: AGPL-3.0
display_name: 好想成为人类啊
short_desc: 自动去除 AI 写作痕迹，让回复更像真人
astrbot_version: ">=4.5.7,<5"
# 本插件经 LLM 钩子（on_llm_request / on_llm_response）与通用消息事件工作，
# 不调用特定平台的私有 API，故声明支持全部适配器（取值须为 ADAPTER_NAME_2_TYPE 的 key）。
# 平台相关能力（如「对方正在输入」感知）在所选平台不支持时自动静默降级，不影响主功能。
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - wecom
  - wecom_ai_bot
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - vocechat
  - weixin_official_account
  - satori
  - misskey
  - line
  - matrix
  - weixin_oc
  - mattermost
  - webchat
tags:
  - humanize
  - 人性化
  - AI 去痕
  - 对话风格
  - 生活状态
  - 模型容错
  - 消息防抖
  - 插件页面
